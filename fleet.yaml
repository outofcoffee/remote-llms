# Cloud environments (dev-* on llama.cpp, vllm-1 on vLLM) and local
# hosts, observed as one fleet.
#
#   spinloop dashboard    # the live tiled view (picks this file up)
#   spinloop status       # one row per environment
#   spinloop metrics -w   # the pipeable live redraw
#
# A node's `name` is what you type at `fleet start <node>`; for a cloud node
# it's the registered environment it drives — one per `spinloop fleet deploy`.
# `kind: cloud` marks it as a cloud environment rather than a host. No
# bearer tokens or URLs here: the control plane signs each call, and each
# environment's control URLs live under ~/.config/spinloop/clouds/<name>/,
# not in this file.

prefer: idle

gateway:
  url: http://localhost:4000
  tokenEnv: OPENAI_API_KEY

apiKeyEnv: OPENAI_API_KEY

nodes:
  - name: dev-1
    kind: cloud
    # 96GB VRAM, RTX PRO 6000 Blackwell, 64GB system RAM
    instance-type: g7e.2xlarge

  - name: dev-2
    kind: cloud

  - name: dev-3
    kind: cloud
    
  - name: dev-4
    kind: cloud

  - name: vllm-1
    kind: cloud

  - name: glimmer
    host: localhost
  
  - name: qwen3.8-27b
    host: localhost

  - name: qwen3.8-27b-omlx
    host: localhost

  - name: qwen3.8-27b-mtplx
    host: localhost
