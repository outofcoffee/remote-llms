; A llama.cpp preset for Qwen3.8-27B

[*]
;host  = 127.0.0.1
;port  = 8080
jinja = 1            # required for Qwen3 tool calling
ngl   = 99           # offload all layers to the GPU; lower for limited VRAM

; Qwen's recommended sampling parameters for *thinking* mode (the model's
; default). llama.cpp's own defaults (temp 0.8, top-k 40, min-p 0.05,
; repeat-penalty 1.1) differ from these, so they're set explicitly here rather
; than left implicit. Non-thinking mode wants a different set — see the
; model card.
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
repeat-penalty   = 1.0
presence-penalty = 0.0

[qwen3.8-27b]         # the Outfit's ALIAS selects this section
hf       = unsloth/Qwen3.8-27B-GGUF:UD-Q8_K_XL
;ctx-size = # set by the Outfit's CONTEXT

fa           = on       # flash attention, needed for the quantised KV cache
cache-type-k = q8_0     # q8 KV; 256k fits the L40S 48 GB (hybrid SSM/attn model,
                        # only ~1 layer in 4 holds a growing KV cache)
cache-type-v = q8_0

; Multi-token prediction: the draft proposes tokens the model verifies in one
; pass. Worth ~1.5-2x on decode; llama-server logs the acceptance rate.
;
; MTP's draft buffers need extra headroom on top of the KV cache, so the
; Outfit's CONTEXT is lower here (196608) than the 262144 a non-MTP run
; fits — otherwise llama-server's memory-fit check aborts at startup since
; ngl=99 is fixed and can't be auto-shrunk to compensate.
spec-type        = draft-mtp
spec-draft-n-max = 4
