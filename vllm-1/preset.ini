; A vLLM preset for Qwen3.8-27B — the same model the dev-* environments serve

[*]
; vLLM takes no sampling flags at all: temperature, top-p, top-k, min-p and
; the penalties are per-request, not server settings (llama-server takes them
; on the command line, vLLM does not). Its engine defaults match Qwen's
; thinking-mode recommendations except top-p (1.0 here, 0.95 in the dev-*) and
; top-k (unbounded here, 20 in the dev-*) — pass those per request where it
; matters.

; vLLM's default attention backend is FlashInfer, whose JIT compile step
; needs nvcc — absent on the slim AMI, and the cause of the first-request
; crash. Pin Triton for the target model. Fresh boots get this from the
; runner's user-data as well; through the deploy config this line also
; reaches an instance woken from pause, where the user-data never re-ran.
; (The drafter does not inherit this flag — it is pinned in
; speculative-config below.)
attention-backend = TRITON_ATTN
; This model's GDN (linear-attention) layers keep a mamba state per
; sequence; at the runner's 0.92 memory budget the L40S profiled 158
; state blocks, and CUDA graph capture refuses to start when
; max_num_seqs (default 256) exceeds them. 128 leaves headroom, and a
; single-tenant environment never comes close to it.
max-num-seqs = 128

[qwen3.8-27b]         # the Outfit's ALIAS selects this section
; Multi-token prediction: vLLM's built-in MTP head proposes tokens the model
; verifies in one pass, the vLLM twin of the llama.cpp environments'
; spec-type draft-mtp. vLLM warns that more than one speculative token may
; lower the acceptance rate — if the spec_decode counters in /metrics read
; poorly, drop num_speculative_tokens to 2 or 1.
; attention_backend pins the *drafter's* attention to the same Triton backend
; the runner forces on the target model: the drafter never inherits the
; --attention-backend flag (vLLM autoselects for it unless the speculative
; config says otherwise), and its autoselect lands on FlashInfer, whose
; JIT-needs-nvcc death was this environment's first-request crash.
speculative-config = {"method": "mtp", "num_speculative_tokens": 4, "attention_backend": "TRITON_ATTN"}
; Tool calling: vLLM needs the parser named explicitly, and it requires the
; flag to be enabled first. Booleans take an empty value — the flag is emitted
; bare, with no argument.
enable-auto-tool-choice =
tool-call-parser        = qwen3_coder
; The FP8 weights take 28.95 GiB of the L40S's 48, leaving 8.28 GiB of KV
; cache at the runner's 0.92 gpu-memory-utilization. Full-precision KV needs
; 13.55 GiB for 196608, so the KV cache goes fp8 (about 6.8 GiB) to fit the
; same window the dev-* environments run.
kv-cache-dtype = fp8
