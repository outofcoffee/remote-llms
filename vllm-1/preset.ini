; A vLLM preset for Qwen3.8-27B — the same model the dev-* environments serve

[*]
; Qwen's recommended sampling parameters for *thinking* mode (the model's
; default), mirrored from the llama.cpp environments so both endpoints sample
; the same way. Non-thinking mode wants a different set — see the model card.
temperature        = 1.0
top-p              = 0.95
top-k              = 20
min-p              = 0.0
repetition-penalty = 1.0
presence-penalty   = 0.0

[qwen3.8-27b]         # the Outfit's ALIAS selects this section
; Multi-token prediction: vLLM's built-in MTP head proposes tokens the model
; verifies in one pass, the vLLM twin of the llama.cpp environments'
; spec-type draft-mtp. vLLM warns that more than one speculative token may
; lower the acceptance rate — if the spec_decode counters in /metrics read
; poorly, drop num_speculative_tokens to 2 or 1.
speculative-config = {"method": "mtp", "num_speculative_tokens": 4}
; Tool calling: vLLM needs the parser named explicitly. Booleans take an empty
; value — the flag is emitted bare, with no argument.
enable-auto-tool-choice =
tool-call-parser        = qwen3_coder
