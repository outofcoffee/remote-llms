# An oMLX preset mirroring the running server's settings (~/.omlx/settings.json).
# `spinloop serve` turns it into an omlx-cli command and runs it.
#
# These are `omlx-cli serve` flags with their leading dashes stripped — NOT
# llama.cpp's; each engine's preset is read in its own vocabulary, so this file
# is not interchangeable with the ones in the llama.cpp environments.

[*]
host = 127.0.0.1
port = 8010

# Paths are passed to the server verbatim, so spell them out in full (`~` is
# not expanded). model-dir holds Qwen3.8-27B-MLX-8bit (under lmstudio-community/).
[default]
model-dir               = /Users/pete/.omlx/models
memory-guard            = balanced     # matches the running server's tier
paged-ssd-cache-dir     = /Users/pete/.omlx/cache
max-concurrent-requests = 8
